# StrainAMR environment, built from scratch on a base conda/mamba install.
#
# Use the libmamba solver (the default in conda >= 23.10). The classic solver struggles
# with bioconda's dependency graph:
#
#     conda install -n base conda-libmamba-solver
#     conda config --set solver libmamba
#     conda config --set channel_priority strict
#
#     conda env create -f environment.yml
#     conda activate strainamr
#     pip install -e .
#     unzip -q localDB.zip
#
# (mamba env create / micromamba work too and need no solver setup.)
#
# Channel order matters: bioconda requires conda-forge to come first. Do not add 'defaults'
# or a channel mirror that pulls packages from defaults -- mixing them with conda-forge is the
# most common cause of unsolvable environments for this file. If your machine has a global
# .condarc that adds channels, override it:
#
#     conda create -n strainamr --override-channels -c conda-forge -c bioconda ...
#
# Versions below are pinned to the environment that was validated end to end on
# Test_genomes.zip (2026-10). Newer versions of rgi, kma and graphaligner do not solve
# together: recent kma builds need libzlib >= 1.3.1 while graphaligner <= 1.0.16 needs
# libzlib < 1.3.0. Bump these together, not one at a time.
name: strainamr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.8.6

  # --- gene calling and resistance-gene annotation
  - prodigal=2.6.3
  - rgi=6.0.3
  - ncbi-amrfinderplus=3.11.2
  - kma=1.4.15            # pinned: newer kma needs libzlib >= 1.3.1, which graphaligner cannot use

  # --- protein clustering
  - mmseqs2=15.6f452
  - cd-hit=4.8.1

  # --- pangenome graph channel
  - minimap2=2.28
  - seqwish=0.7.8
  - graphaligner=1.0.17

  # --- k-mer channel
  - mash=2.3

  # --- python
  - pytorch=1.12.0        # CPU build; for CUDA see https://pytorch.org/get-started/locally/
  - numpy=1.23.4
  - scipy=1.10.1
  - pandas=1.5.1
  - scikit-learn=1.1.3
  - statsmodels=0.13.5
  - biopython=1.78
  - matplotlib=3.6.2
  - seaborn=0.12.1
  - shap=0.41.0
  - tqdm=4.64.1
  - pip=22.3.1
